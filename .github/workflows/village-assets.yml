name: Validate 3D Assets and Both Chapters
on:
  push:
    branches: [main]
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'progression.js'
      - 'script.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'
  pull_request:
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'progression.js'
      - 'script.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'

jobs:
  check-gltf-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original glTF pack, loader integration and UI references
        run: node tools/validate-village.mjs
      - name: Validate explorer rig and character geometry
        run: node tools/validate-explorer.mjs
      - name: Exhaustively test all 262144 pipeline orientations
        run: node tools/test-pipes.mjs
      - name: Test Valley unlock and Forgotten Canyon quest progression
        run: node tools/test-chapters.mjs
