name: Validate 3D Assets and All Chapters
on:
  push:
    branches: [main]
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'assets/materials/**'
      - 'assets/illustrations/**'
      - 'assets/fonts/**'
      - 'typography.js'
      - 'world-labels.js'
      - 'cinematic-*'
      - 'surface-detail.js'
      - 'supply-interactions.*'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'tools/test-valley-movement.mjs'
      - 'canyon-visuals.js'
      - 'tools/test-canyon-visuals.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'styles.css'
      - 'progression.js'
      - 'script.js'
      - 'valley-restoration.js'
      - 'village-life.*'
      - 'expedition-mode.js'
      - 'coast*.js'
      - 'coast.css'
      - 'explorer.js'
      - 'tools/test-explorer-motion.mjs'
      - 'tools/**'
      - 'canyon-map.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'
  pull_request:
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'assets/materials/**'
      - 'assets/illustrations/**'
      - 'assets/fonts/**'
      - 'typography.js'
      - 'world-labels.js'
      - 'cinematic-*'
      - 'surface-detail.js'
      - 'supply-interactions.*'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'tools/test-valley-movement.mjs'
      - 'canyon-visuals.js'
      - 'tools/test-canyon-visuals.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'styles.css'
      - 'progression.js'
      - 'script.js'
      - 'valley-restoration.js'
      - 'village-life.*'
      - 'expedition-mode.js'
      - 'coast*.js'
      - 'coast.css'
      - 'explorer.js'
      - 'tools/test-explorer-motion.mjs'
      - 'tools/**'
      - 'canyon-map.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'

jobs:
  check-gltf-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original glTF pack, loader integration and UI references
        run: node tools/validate-village.mjs
      - name: Validate explorer rig and character geometry
        run: node tools/validate-explorer.mjs
      - name: Exhaustively test all 262144 pipeline orientations
        run: node tools/test-pipes.mjs
      - name: Test Valley unlock and Forgotten Canyon quest progression
        run: node tools/test-chapters.mjs
      - name: Verify save recovery, migration and storage-denied play
        run: node tools/test-progression.mjs
      - name: Verify Canyon checkpoint, puzzle and navigation regressions
        run: node tools/test-canyon-regressions.mjs
      - name: Verify character movement controls after graphics merges
        run: node tools/test-valley-movement.mjs
      - name: Validate Forgotten Canyon 3D art and character integration
        run: node tools/test-canyon-visuals.mjs
      - name: Validate screen-space mission labels in all three chapters
        run: node tools/test-world-labels.mjs
      - name: Verify licensed 3D model placement and fallback across all four scenes
        run: node tools/test-scenic-assets.mjs

      - name: Test shared explorer grounding, victory and camera obstruction fading
        run: node tools/test-explorer-motion.mjs
      - name: Verify play-style preferences and village resource persistence
        run: |
          node tools/test-expedition-mode.mjs
          node tools/test-village-life.mjs
      - name: Verify Coast puzzles, navigation, saves and replay
        run: node tools/test-coast.mjs

  browser-gameplay:
    # Playwright 1.58 supports 24.04; ubuntu-latest has advanced to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test driver
        # The runner includes Chrome and its OS libraries; reuse those instead
        # of downloading a second browser and reinstalling system packages.
        run: python -m pip install playwright==1.58.0
      - name: Play both chapters through the real interface in 2D fallback
        run: python tools/test-browser.py --browser "$(command -v google-chrome)"
      - name: Play Village Life and Stormbreak Coast through the interface
        run: python tools/test-expansion-browser.py --browser "$(command -v google-chrome)"
      - name: Verify expansion mobile layout and touch controls
        run: python tools/test-expansion-browser.py --mobile --browser "$(command -v google-chrome)"
      - name: Verify difficulty Settings, saved work and chapter puzzle changes
        run: python tools/test-difficulty-browser.py --browser "$(command -v google-chrome)"
      - name: Verify mobile difficulty Settings and keyboard controls
        run: python tools/test-difficulty-browser.py --mobile --browser "$(command -v google-chrome)"
      - name: Verify DOM addition removal and changes through actual player controls
        run: python tools/test-dom-interactions-browser.py --browser "$(command -v google-chrome)"
      - name: Verify mobile DOM interactions and keyboard focus
        run: python tools/test-dom-interactions-browser.py --mobile --browser "$(command -v google-chrome)"
      - name: Compile cinematic shaders and verify actual WebGL output
        run: python tools/test-graphics-browser.py --smoke --label ci-smoke --browser "$(command -v google-chrome)"
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots
          path: |
            work/browser-qa/
            work/expansion-qa/
            work/graphics-qa/ci-smoke/
            work/difficulty-qa/
            work/dom-outcome-qa/
          if-no-files-found: ignore

  scenic-webgl:
    # Run independently of the 2D puzzle suite so 3D asset failures are obvious.
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing driver
        run: python -m pip install playwright==1.58.0
      - name: Confirm licensed GLB models actually load in every 3D world
        run: python tools/test-scenic-browser.py --browser "$(command -v google-chrome)"
      - name: Save screenshots of the four upgraded scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc0-scenic-world-screenshots
          path: work/scenic-qa/
          if-no-files-found: ignore
