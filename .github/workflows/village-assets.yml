name: Validate 3D Assets and Both Chapters
on:
  push:
    branches: [main]
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'tools/test-valley-movement.mjs'
      - 'canyon-visuals.js'
      - 'tools/test-canyon-visuals.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'styles.css'
      - 'progression.js'
      - 'script.js'
      - 'explorer.js'
      - 'tools/test-explorer-motion.mjs'
      - 'tools/**'
      - 'canyon-map.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'
  pull_request:
    paths:
      - 'assets/village/**'
      - 'assets/characters/**'
      - 'tools/validate-village.mjs'
      - 'tools/validate-explorer.mjs'
      - 'tools/test-pipes.mjs'
      - 'tools/test-chapters.mjs'
      - 'tools/test-valley-movement.mjs'
      - 'canyon-visuals.js'
      - 'tools/test-canyon-visuals.mjs'
      - 'canyon.js'
      - 'canyon.css'
      - 'styles.css'
      - 'progression.js'
      - 'script.js'
      - 'explorer.js'
      - 'tools/test-explorer-motion.mjs'
      - 'tools/**'
      - 'canyon-map.js'
      - 'index.html'
      - '.github/workflows/village-assets.yml'

jobs:
  check-gltf-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original glTF pack, loader integration and UI references
        run: node tools/validate-village.mjs
      - name: Validate explorer rig and character geometry
        run: node tools/validate-explorer.mjs
      - name: Exhaustively test all 262144 pipeline orientations
        run: node tools/test-pipes.mjs
      - name: Test Valley unlock and Forgotten Canyon quest progression
        run: node tools/test-chapters.mjs
      - name: Verify save recovery, migration and storage-denied play
        run: node tools/test-progression.mjs
      - name: Verify Canyon checkpoint, puzzle and navigation regressions
        run: node tools/test-canyon-regressions.mjs
      - name: Verify character movement controls after graphics merges
        run: node tools/test-valley-movement.mjs
      - name: Validate Forgotten Canyon 3D art and character integration
        run: node tools/test-canyon-visuals.mjs

      - name: Test shared explorer grounding, victory and camera obstruction fading
        run: node tools/test-explorer-motion.mjs

  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Play both chapters through the real interface in 2D fallback
        run: python tools/test-browser.py
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots
          path: work/browser-qa/
          if-no-files-found: ignore
